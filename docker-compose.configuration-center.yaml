# Build the complete source first:
#   docker build -t clamav-web-client:${CLAMAV_WEBUI_IMAGE_TAG:-local} .
# Start this example from the repository root. Conf/data must be writable by UID 10001.
services:
  clamav-web-client:
    image: clamav-web-client:${CLAMAV_WEBUI_IMAGE_TAG:-local}
    pull_policy: never
    container_name: clamav-web-client
    ports:
      # Open http://YOUR_SERVER:8080/setup/ directly. Change the host port as needed.
      - "8080:8080"
    volumes:
      - ./conf:/app/conf
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Allow Hikari / embedded file H2 to release the DB lock before Docker SIGKILL.
    stop_grace_period: 60s
    restart: unless-stopped
