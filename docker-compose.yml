# Safe default for fresh installations. Do not replace an existing production
# Compose file; merge changes into that deployment after backup and testing.
# Set CLAMAV_BASE_IMAGE to a VERIFIED pinned image digest in .env first.
services:
  clamav-web-client:
    image: clamav-web-client:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clamav-web-client
    ports:
      # NGINX on the Docker host terminates HTTPS; do not expose app HTTP directly.
      - "${CLAMAV_WEB_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    environment:
      CLAMAV_HOST: "clamav-server"
      CLAMAV_PORT: "3310"
      # No upload scan-mode overrides. Fresh installs default to INSTREAM;
      # Configuration Center can change the mode.
      # Set real DB and trusted HTTPS proxy configuration per deployment.
    volumes:
      - ./conf:/app/conf
      - ./data:/app/data
    depends_on:
      clamav-server:
        condition: service_started
    restart: unless-stopped

  clamav-server:
    image: "${CLAMAV_BASE_IMAGE:?Set a verified pinned clamav/clamav digest in .env}"
    container_name: clamav
    # No host-published TCP/3310 and no application-data mount (issue #15).
    restart: unless-stopped
