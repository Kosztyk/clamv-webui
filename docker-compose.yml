# Safe default for fresh installations. Do not replace an existing production
# Compose file; merge changes into that deployment after backup and testing.
# The scanner uses the verified 1.4.7 digest by default (see docs/security/clamd-image-pin.json).
# For an intentional update, change the digest in this default, the pin manifest,
# Dockerfile.clamd and .env.example together after verifying multi-arch support.
services:
  clamav-web-client:
    image: "${CLAMAV_WEBUI_IMAGE_REF:-clamav-web-client:${CLAMAV_WEBUI_IMAGE_TAG:-local}}"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clamav-web-client
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # NGINX on the Docker host terminates HTTPS; do not expose app HTTP directly.
      - "${CLAMAV_WEB_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    environment:
      CLAMAV_HOST: "clamav-server"
      CLAMAV_PORT: "3310"
      # Issue #40: if configuring an external REST scanner with an API key,
      # prefer HTTPS for CLAMAV_REST_URL. For non-loopback HTTP, explicitly
      # set CLAMAV_REST_ALLOW_INSECURE: "true" (or manage it in Configuration Center).
      # Do not add the insecure override unless the risk is understood.
      # No upload scan-mode overrides. Fresh installs default to INSTREAM;
      # Configuration Center can change the mode.
      # Set real DB and trusted HTTPS proxy configuration per deployment.
    volumes:
      - ./conf:/app/conf
      - ./data:/app/data
    # Allow Hikari / file-backed H2 to flush and release database locks on SIGTERM.
    stop_grace_period: 60s
    depends_on:
      clamav-server:
        condition: service_started
    restart: unless-stopped

  clamav-server:
    image: "${CLAMAV_BASE_IMAGE:-clamav/clamav:1.4.7@sha256:b7357e2c1c59480628839df301b0d27923561389b36cf341911e1dd9e02cdd05}"
    container_name: clamav
    # No host-published TCP/3310 and no application-data mount (issue #15).
    restart: unless-stopped
