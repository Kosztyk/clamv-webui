services:
  clamav-web-client:
    # Build the application from the Dockerfile in this directory.
    # This is a LOCAL tag; Docker Compose will build it, not pull it from Docker Hub.
    image: clamav-web-client:2.1.0-local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      pull: false

    container_name: clamav-web-client

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ports:
      - "8080:8080"

    # First-run application settings are entered at /setup/ on this port.
    # When using the bundled scanner, enter clamav-server:3310 in the GUI.

    volumes:
      # Prepare existing host folders for UID/GID 10001; see docs/NON_ROOT_CONTAINER.md.
      - ./conf:/app/conf
      - ./data:/app/data

    depends_on:
      clamav-server:
        condition: service_started

    restart: unless-stopped

  clamav-server:
    image: clamav/clamav:latest
    container_name: clamav

    ports:
      - "3310:3310"

    volumes:
      - ./data:/app/data:ro

    restart: unless-stopped
