# v2.1beta1 secure fresh-install example for HTTPS proxy on Docker host.
# Do not overwrite an existing PostgreSQL/LDAP/OIDC/NGINX deployment.
services:
  clamav-web-client:
    image: clamav-web-client:2.1beta1-local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    container_name: clamav-web-client
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${CLAMAV_WEB_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    environment:
      CLAMAV_HOST: "clamav-server"
      CLAMAV_PORT: "3310"
      # No scan mode override: fresh-install default is INSTREAM.
      # Configure the deployment-specific database and trusted HTTPS proxy separately.
    volumes:
      - ./conf:/app/conf
      - ./data:/app/data
    depends_on:
      clamav-server:
        condition: service_started
    restart: unless-stopped
  clamav-server:
    image: "${CLAMAV_BASE_IMAGE:?Set a verified immutable ClamAV image digest in .env}"
    container_name: clamav
    # Issue #15: no published port, no access to the entire application data volume.
    restart: unless-stopped
