services:
  clamav-web-client:
    # Build the application from the Dockerfile in this directory.
    # This is a LOCAL tag; Docker Compose will build it, not pull it from Docker Hub.
    image: clamav-web-client:2.0.0-local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      pull: false

    container_name: clamav-web-client

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ports:
      - "8080:8080"

    environment:
      # Matches the packaged default; the trusted proxy must replace forwarded headers.
      SERVER_FORWARD_HEADERS_STRATEGY: "${SERVER_FORWARD_HEADERS_STRATEGY:-framework}"
      # Optional webhook tuning; finite timeouts and public destinations are the built-in defaults.
      CLAMAV_WEBHOOK_CONNECT_TIMEOUT: "${CLAMAV_WEBHOOK_CONNECT_TIMEOUT:-5s}"
      CLAMAV_WEBHOOK_READ_TIMEOUT: "${CLAMAV_WEBHOOK_READ_TIMEOUT:-10s}"
      CLAMAV_WEBHOOK_DNS_TIMEOUT: "${CLAMAV_WEBHOOK_DNS_TIMEOUT:-5s}"
      CLAMAV_WEBHOOK_DELIVERY_TIMEOUT: "${CLAMAV_WEBHOOK_DELIVERY_TIMEOUT:-20s}"
      CLAMAV_WEBHOOK_WORKERS: "${CLAMAV_WEBHOOK_WORKERS:-2}"
      CLAMAV_WEBHOOK_QUEUE_CAPACITY: "${CLAMAV_WEBHOOK_QUEUE_CAPACITY:-100}"
      CLAMAV_WEBHOOK_ALLOW_PRIVATE_ADDRESSES: "${CLAMAV_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:-false}"
      # Use the bundled ClamAV service on the Compose network.
      # If clamd runs elsewhere, override this in your own deployment Compose.
      CLAMAV_HOST: "clamav-server"
      CLAMAV_PORT: "3310"

      # REST URL is reached by the GUI container, not by the browser.
      CLAMAV_REST_URL: "http://192.168.68.144:3000"
      CLAMAV_REST_API_KEY: ""
      CLAMAV_REST_FORM_KEY: "FILES"
      CLAMAV_REST_TIMEOUT_SECONDS: "10"
      CLAMAV_REST_UPLOAD_TIMEOUT_SECONDS: "3600"
      CLAMAV_REST_REPORT_MAX_JOBS: "5000"

      CLAMAV_UPLOAD_PATH_SCAN_ENABLED: "true"
      CLAMAV_UPLOAD_PATH_SCAN_FALLBACK_TO_INSTREAM: "false"

    volumes:
      # Prepare existing host folders for UID/GID 10001; see docs/NON_ROOT_CONTAINER.md.
      - ./conf:/app/conf
      - ./data:/app/data

    depends_on:
      clamav-server:
        condition: service_started

    restart: unless-stopped

  clamav-server:
    image: clamav/clamav:latest
    container_name: clamav

    ports:
      - "3310:3310"

    volumes:
      - ./data:/app/data:ro

    restart: unless-stopped
