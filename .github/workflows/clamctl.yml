name: clamctl / test and cross-platform binaries
on:
  push:
    paths: ['cli/**', 'src/main/java/**', 'src/main/resources/openapi/**', 'scripts/test-clamctl-integration.py', 'scripts/home-lab-mcp-test.py', 'pom.xml', '.github/workflows/clamctl.yml']
  pull_request:
    paths: ['cli/**', 'src/main/java/**', 'src/main/resources/openapi/**', 'scripts/test-clamctl-integration.py', 'scripts/home-lab-mcp-test.py', 'pom.xml', '.github/workflows/clamctl.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o clamctl-test${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/clamctl
      - name: Executable smoke test
        shell: bash
        run: ./clamctl-test* --version
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go run ./tools/build.go
        working-directory: cli
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - run: python3 scripts/test-clamctl-integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: clamctl-v2.0.0-all-platforms
          path: |
            cli/dist/
            cli/README.md
            cli/LICENSE
            cli/GO-LICENSE.txt
            cli/THIRD_PARTY_NOTICES.md
            cli/third_party/
            docs/MCP.md
            examples/mcp/
