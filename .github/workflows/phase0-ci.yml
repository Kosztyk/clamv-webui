name: Phase 0 baseline / Docker & ClamAV smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package from clean checkout
        run: mvn -B -ntp verify
      - name: Verify source, six languages, and authentication routes
        run: bash scripts/release-gate.sh --static-only
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build deployment Docker image (includes Maven verification)
        run: docker compose build --pull
      - name: Start web UI and ClamAV
        run: docker compose up -d --no-build
      - name: Verify web login, daemon, native MULTISCAN/EICAR and audit
        run: bash scripts/smoke-eicar.sh
      - name: Check ClamdTop page and native mode configuration
        run: |
          test "$(docker compose exec -T clamav-web-client printenv CLAMAV_UPLOAD_PATH_SCAN_ENABLED)" = true
          test "$(docker compose exec -T clamav-web-client printenv CLAMAV_UPLOAD_PATH_SCAN_FALLBACK_TO_INSTREAM)" = false
          curl --fail --silent http://127.0.0.1:8080/login | grep -q 'ClamAV Web UI'
          test -s data/bootstrap-admin-password
      - name: Verify Prometheus is fail-closed without a configured token
        run: |
          actual=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/prometheus)
          test "$actual" = 403
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=160
      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
