name: Phase 0 baseline / Docker & ClamAV smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser regression dependencies
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Test and package from clean checkout
        run: mvn -B -ntp verify
      - name: Verify direct HTTP setup and administration in Chromium
        run: python3 scripts/test_configuration_center_direct.py
      - name: Verify sole configuration editor, legacy identity upgrade and live job completion
        run: python3 scripts/test_configuration_center_consolidation.py
      - name: Audit all configuration fields, runtime settings and self-signed REST TLS
        run: python3 scripts/test_configuration_center_all_fields.py
      - name: Verify database tests before startup and after initialization over direct HTTP
        run: python3 scripts/test_configuration_database_setup.py
      - name: Verify complete-source GitHub publisher with local Git fixtures
        run: python3 scripts/test-publish-clamav-webui.py
      - name: Audit source privacy and runtime-file exclusions
        run: python3 tools/audit-source-package.py .
      - name: Verify server deployment helper and proxy-mode persistence
        run: python3 scripts/test-server-deployment-helper.py
      - name: Verify source, six languages, and authentication routes
        run: bash scripts/release-gate.sh --static-only
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build deployment Docker image (includes Maven verification)
        run: docker compose build --pull
      - name: Prepare non-root bind mounts on the Linux runner
        run: |
          mkdir -p conf data
          sudo chown -R 10001:10001 conf data
          sudo chmod -R u+rwX conf data
      - name: Start web UI and ClamAV
        run: docker compose up -d --no-build
      - name: Verify non-root identity, writable volumes and native PTY
        run: bash scripts/smoke-non-root.sh
      - name: Complete first-run setup directly over HTTP without a reverse proxy
        run: python3 scripts/smoke-setup.py
      - name: Verify web login, daemon, native MULTISCAN/EICAR and audit
        run: bash scripts/smoke-eicar.sh
      - name: Check ClamdTop page and native mode configuration
        run: |
          curl --fail --silent http://127.0.0.1:8080/login | grep -q 'ClamAV Web UI'
          docker compose exec -T clamav-web-client test -s /app/data/bootstrap-admin-password
      - name: Verify Prometheus is fail-closed without a configured token
        run: |
          actual=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/prometheus)
          test "$actual" = 403
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=160
      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
