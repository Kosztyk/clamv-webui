name: CI

# v2.1.0 full release verification: touching this critical control intentionally forces every CI scope.

# No event-level path filters: the stable `gate` check reports on every PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Monday weekly security rescan (UTC)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      static: ${{ steps.filter.outputs.static }}
      java: ${{ steps.filter.outputs.java }}
      db: ${{ steps.filter.outputs.db }}
      cli: ${{ steps.filter.outputs.cli }}
      docker: ${{ steps.filter.outputs.docker }}
      browser: ${{ steps.filter.outputs.browser }}
      codeql: ${{ steps.filter.outputs.codeql }}
      security: ${{ steps.filter.outputs.security }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      api: ${{ steps.filter.outputs.api }}
      upgrade: ${{ steps.filter.outputs.upgrade }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: Classify changed paths (fail closed if base unavailable)
        env:
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci-detect-changes.py

  static:
    name: static
    needs: changes
    if: ${{ needs.changes.outputs.static == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install YAML and upgrade fixture test dependencies
        run: python -m pip install PyYAML==6.0.2 cryptography==46.0.4
      - name: Block private infrastructure addresses and validate release documentation
        run: |
          python3 tools/audit-source-package.py .
          python3 scripts/check-issue56-release-docs.py
          python3 scripts/test-issue56-release-docs.py
      - name: Validate unified workflow and decision gate
        run: |
          python3 scripts/check-versions.py
          python3 scripts/test-issue50-versions.py
          python3 scripts/check-ci-workflow.py
          python3 scripts/test-ci-gate.py
          python3 scripts/check-issue49-release.py
          python3 scripts/test-issue49-release.py
          python3 scripts/test-issue49-policy.py
          python3 scripts/check-issue51-container-release.py
          python3 scripts/test-issue51-image-release.py
          python3 scripts/test-issue51-policy.py
          python3 scripts/check-issue52-security-gates.py
          python3 scripts/test-issue52-security-gates.py
          python3 scripts/check-issue53-java-quality.py
          python3 scripts/test-issue53-java-quality.py
          python3 scripts/test-full-source-audit-regressions.py
          python3 scripts/test-2026-cumulative-regressions.py
          python3 scripts/check-issue54-cli-quality.py
          python3 scripts/test-issue54-cli-quality.py
          python3 scripts/issue55-api-contract.py
          python3 scripts/test-issue55-api-contract.py
          python3 scripts/check-issue57-upgrade-path.py
          python3 scripts/test-issue57-upgrade-path.py
          python3 scripts/check-issue58-hardening.py
          python3 scripts/test-issue58-hardening.py
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source integrity and supply-chain contracts
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          python3 scripts/check-issue36-h2-source.py
          python3 scripts/check-issue37-maintenance.py
          python3 scripts/check-issue38-clamdtop-security.py
          python3 scripts/check-issue38-config-center.py
          python3 scripts/check-issue39-security.py
          python3 scripts/check-issue40-rest-security.py
          python3 scripts/check-issue41-csv-export.py
          python3 scripts/check-issue42-runtime-config.py
          python3 scripts/check-issue43-legacy-api.py
          python3 scripts/check-issue44-ldap-identity.py
          python3 scripts/check-issue45-supply-chain.py
          python3 scripts/check-issue46-service-layer.py
          python3 scripts/check-static-inventory.py
          python3 scripts/check-db-inventory.py
          python3 scripts/check-monitoring-inventory.py

  api-contract:
    name: api-contract
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser for structural checks
        run: python3 -m pip install PyYAML==6.0.2
      - name: Fail on controller, OpenAPI or Go CLI endpoint drift
        run: |
          python3 scripts/issue55-api-contract.py
          python3 scripts/test-issue55-api-contract.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Spectral lint using repository API ruleset
        run: npx --yes --package=@stoplight/spectral-cli@6.17.1 spectral lint --ruleset .spectral.yaml --fail-severity error src/main/resources/openapi/clamav-v1.yaml
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Install pinned oasdiff API breaking-change comparator
        run: go install github.com/oasdiff/oasdiff@v1.11.8
      - name: Block breaking changes relative to last release and PR base
        env:
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/issue58-resolve-predecessor.py --stable-only --output artifacts/api-contract/predecessor.json
          previous="$(python3 -c 'import json; print(json.load(open("artifacts/api-contract/predecessor.json"))["commit_sha"])')"
          python3 scripts/issue55-api-breaking.py --previous-tag "$previous" --oasdiff "$(go env GOPATH)/bin/oasdiff"
      - name: Upload API contract lint and compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-contract-reports
          path: artifacts/api-contract/**
          if-no-files-found: warn
          retention-days: 14

  java-tests:
    name: java-tests-jdk-${{ matrix.jdk }}
    needs: changes
    if: ${{ needs.changes.outputs.java == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # The application compiles for Java 21 (Thread.threadId etc); JDK 17 cannot compile it.
        jdk: ['21', '25']
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Maven unit and Spring integration tests with JaCoCo coverage threshold
        run: mvn -B -ntp clean verify
      - name: Verify Maven-filtered app and OpenAPI metadata
        run: python3 scripts/check-versions.py --verify-built
      - name: Upload Surefire/Failsafe and JaCoCo coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-test-reports-jdk-${{ matrix.jdk }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
            target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14

  java-quality:
    name: java-quality
    needs: changes
    if: ${{ needs.changes.outputs.java == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Select immutable PR/push base for static analysis comparison
        id: base
        env:
          QUALITY_PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUALITY_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${QUALITY_PR_BASE:-${QUALITY_PUSH_BEFORE:-}}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          [[ "$base" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'No immutable quality baseline SHA' >&2; exit 1; }
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Build candidate reports, enforce dependency convergence, and run tests
        run: mvn -B -ntp -Pci-quality verify
      - name: Spotless Google Java Format gate on changed files
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: mvn -B -ntp -Pci-quality -Dspotless.ratchet.ref="$BASE_SHA" spotless:check
      - name: Analyze original base with the exact same SpotBugs/FindSecBugs and PMD configuration
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          baseline="$(mktemp -d)/base"
          git worktree add --detach "$baseline" "$BASE_SHA"
          echo "QUALITY_BASELINE=$baseline" >> "$GITHUB_ENV"
          python3 scripts/issue53-prepare-baseline.py --baseline "$baseline/pom.xml"
          mvn -B -ntp -f "$baseline/pom.xml" -Pci-quality -Denforcer.skip=true verify
      - name: Block decreases in actual JaCoCo line coverage
        run: python3 scripts/issue58-coverage-ratchet.py --baseline "$QUALITY_BASELINE/target/site/jacoco/jacoco.xml" --candidate target/site/jacoco/jacoco.xml
      - name: Fail on new static analysis findings, not pre-existing debt
        run: |
          python3 scripts/issue53-compare-quality.py --baseline "$QUALITY_BASELINE/target" \
            --reviewed-baseline config/java-quality-baseline.json --candidate target
      - name: Upload Java static analysis and baseline findings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-quality-spotbugs-pmd
          path: |
            target/spotbugs.xml
            target/spotbugsXml.xml
            target/pmd.xml
          if-no-files-found: warn
          retention-days: 14

  upgrade-path:
    name: upgrade-${{ matrix.vendor }}
    needs: changes
    if: ${{ needs.changes.outputs.upgrade == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        vendor: [h2, postgresql]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install YAML and encryption dependencies for upgrade fixtures
        run: python3 -m pip install PyYAML==6.0.2 cryptography==46.0.4
      - name: Validate pinned predecessor and versioned upgrade fixtures
        run: |
          python3 scripts/check-issue57-upgrade-path.py
          python3 scripts/test-issue57-upgrade-path.py
      - name: Prepare Maven JDBC drivers
        run: |
          mvn -B -ntp -q dependency:copy-dependencies \
            -DincludeGroupIds=com.h2database,org.postgresql \
            -DoutputDirectory=artifacts/upgrade-drivers
      - name: Resolve the latest published predecessor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/issue58-resolve-predecessor.py
      - name: Boot tagged previous release, seed actual DB, upgrade candidate and verify data/auth
        env:
          UPGRADE_VENDOR: ${{ matrix.vendor }}
        run: python3 scripts/issue57-upgrade-path.py --vendor "$UPGRADE_VENDOR"
      - name: Upload redacted upgrade evidence and failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-path-${{ matrix.vendor }}
          path: artifacts/upgrade-path/**
          if-no-files-found: warn
          retention-days: 14

  db-migrations:
    name: db-migrations-${{ matrix.vendor }}
    needs: [changes, java-tests]
    if: ${{ needs.changes.outputs.db == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        vendor: [postgresql, mysql, mariadb]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test vendor Flyway migrations with Testcontainers
        env:
          DB_VENDOR: ${{ matrix.vendor }}
        run: >-
          mvn -B -ntp -Pdb-integration
          -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=Phase2DatabaseIT
          -Dclamav.db.vendor="$DB_VENDOR" -Djacoco.skip=true verify
      - name: Upload Surefire/Failsafe reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-${{ matrix.vendor }}-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
      - name: Capture container diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p artifacts/db
          docker ps -a --no-trunc > artifacts/db/containers.txt || true
      - name: Upload database container diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-${{ matrix.vendor }}-containers
          path: artifacts/db/**
          if-no-files-found: ignore
          retention-days: 7

  cli-test:
    name: cli-test-${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Run CLI unit tests and go vet
        working-directory: cli
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Race detector on Linux
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        working-directory: cli
        run: go test -race -count=1 ./...
      - name: Install pinned staticcheck and govulncheck
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Block staticcheck findings
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        working-directory: cli
        run: |
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Block reachable Go vulnerabilities
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        working-directory: cli
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  cli-build:
    name: cli-build
    needs: [changes, cli-test]
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build twice with a fixed SOURCE_DATE_EPOCH and compare all six binary hashes
        run: python3 scripts/issue54-cli-repro.py --out cli/dist
      - name: Upload reproducible CLI binaries, manifest and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clamctl-distribution
          path: cli/dist/**
          if-no-files-found: error
          retention-days: 14

  cli-integration:
    name: cli-integration
    needs: [changes, cli-build]
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: clamctl-distribution
          path: cli/dist
      - name: Restore executable mode and verify artifact checksums and embedded version
        run: |
          chmod +x cli/dist/linux_amd64/clamctl
          python3 scripts/issue54-cli-repro.py --verify-only --out cli/dist
      - name: Package the actual Spring application for CLI integration
        run: mvn -B -ntp -DskipTests package
      - name: Test native clamctl against a real isolated Spring application
        run: python3 scripts/test-clamctl-integration.py

  docker-smoke:
    name: docker-smoke
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      COMPOSE_PROJECT_NAME: clamav-ci-${{ github.run_id }}
      COMPOSE_FILE: docker-compose.yml:examples/compose/shared-paths.override.yaml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build digest-pinned application image
        run: |
          commit="$(git rev-parse HEAD)"
          version="$(python3 scripts/check-versions.py --print-version)"
          docker build --progress plain --build-arg "CLAMAV_APP_VERSION=$version" \
            --label "org.opencontainers.image.revision=$commit" \
            --tag clamav-web-client:issue45-ci .
          echo "Source commit: $commit" | tee -a "$GITHUB_STEP_SUMMARY"
          docker image tag clamav-web-client:issue45-ci clamav-web-client:local
      - name: Fail on known CRITICAL OS/library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clamav-web-client:issue45-ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: table
          version: v0.70.0
          timeout: 10m0s
      - name: Block FIXABLE HIGH/CRITICAL OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clamav-web-client:issue45-ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: table
          version: v0.70.0
          timeout: 10m0s
      - name: Report runtime OS vulnerabilities at every severity
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clamav-web-client:issue45-ci
          scanners: vuln
          vuln-type: os
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          format: table
          skip-setup-trivy: true
          timeout: 10m0s
      - name: Report candidate image size
        run: |
          echo '### Container size comparison' >> "$GITHUB_STEP_SUMMARY"
          docker image inspect clamav-web-client:issue45-ci --format 'Candidate: {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Checkout PR base image source for size comparison
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Build and compare image sizes against PR base
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker build --progress plain --tag clamav-web-client:baseline baseline
          OLD="$(docker image inspect clamav-web-client:baseline --format '{{.Size}}')"
          NEW="$(docker image inspect clamav-web-client:issue45-ci --format '{{.Size}}')"
          python3 - "$OLD" "$NEW" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          before, after = map(int, sys.argv[1:])
          print(f'PR base: {before:,} bytes ({before/1048576:.2f} MiB)')
          print(f'Candidate: {after:,} bytes ({after/1048576:.2f} MiB)')
          print(f'Change: {after-before:+,} bytes ({(after-before)/before*100:+.2f}%)')
          PY
      - name: Assert image HEALTHCHECK, non-root user and H2 lock cleanup
        run: bash scripts/issue37-smoke.sh clamav-web-client:issue45-ci
      - name: Validate isolated scanner Compose bindings
        run: |
          docker compose config --quiet
          python3 scripts/test-clamd-compose-isolation.py
      - name: Prepare non-root storage and build the UID-matched ClamD companion
        run: |
          mkdir -p conf data/uploads scandir
          sudo chown -R 10001:10001 conf data
          sudo chmod 0700 conf data/uploads
          docker compose build clamav-server
      - name: Start disposable scanner and Web UI
        run: docker compose up -d --no-build
      - name: Verify native EICAR, clean upload, non-root confinement and scanner isolation
        run: |
          bash scripts/smoke-non-root.sh
          bash scripts/smoke-eicar.sh
          CLAMAV_SMOKE_CLEAN=true bash scripts/smoke-eicar.sh
          python3 scripts/test-clamd-compose-isolation.py --runtime-native
      - name: Capture disposable container logs
        if: ${{ always() }}
        run: |
          mkdir -p artifacts/container-logs
          docker compose ps -a > artifacts/container-logs/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/container-logs/compose.log 2>&1 || true
      - name: Upload container logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-smoke-logs
          path: artifacts/container-logs/**
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable CI containers and volumes
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans || true

  browser:
    name: browser
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI_BROWSER_TRACE_DIR: artifacts/playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci-browser-requirements.txt
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install -r scripts/ci-browser-requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Run six-language and terminal layout browser smoke tests
        run: |
          python3 scripts/test-native-clamdtop-browser.py
          python3 scripts/check-i18n.py
      - name: Upload Playwright traces
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: artifacts/playwright/**
          if-no-files-found: warn
          retention-days: 7

  secrets:
    name: secrets
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Install pinned open-source Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan checked-out source for committed secrets (blocking)
        run: |
          mkdir -p artifacts/security
          "$(go env GOPATH)/bin/gitleaks" dir --redact --exit-code 1 \
            --report-format json --report-path artifacts/security/gitleaks.json .
      - name: Scan new PR/push commit history (includes deleted secrets)
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! [[ "$SECRET_SCAN_BASE" =~ ^[a-fA-F0-9]{40}$ ]] || [[ "$SECRET_SCAN_BASE" =~ ^0+$ ]]; then
            echo 'Missing valid diff base; refusing to skip commit-history secret scanning' >&2
            exit 1
          fi
          git cat-file -e "$SECRET_SCAN_BASE^{commit}"
          "$(go env GOPATH)/bin/gitleaks" git --redact --exit-code 1 \
            --log-opts="$SECRET_SCAN_BASE..HEAD" .
      - name: Verify secret scanner detects synthetic credentials
        run: bash scripts/issue52-gitleaks-fixture.sh
      - name: Upload redacted findings report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-findings
          path: artifacts/security/gitleaks.json
          if-no-files-found: ignore
          retention-days: 7

  workflow-lint:
    name: workflow-lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: actionlint - strict GitHub workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -oneline
      - name: hadolint - web application Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          no-fail: 'false'
      - name: hadolint - ClamAV Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile.clamd
          failure-threshold: error
          no-fail: 'false'
      - name: hadolint - UID-adjusted ClamAV Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile.clamd-uid
          failure-threshold: error
          no-fail: 'false'

  dependency-vulns:
    name: dependency-vulns
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Install pinned OSV-Scanner binary (no transitive mutable container tag)
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.1
      - name: OSV scan Maven, Go and other tracked dependencies (blocking)
        run: |
          mkdir -p artifacts/security
          "$(go env GOPATH)/bin/osv-scanner" scan source \
            --config=osv-scanner.toml \
            --format=json --output=artifacts/security/osv.json \
            --recursive ./
      - name: Upload OSV findings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-osv
          path: artifacts/security/osv.json
          if-no-files-found: warn
          retention-days: 14

  filesystem-vulns:
    name: filesystem-vulns
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare Trivy filesystem report
        run: mkdir -p artifacts/security
      - name: Trivy filesystem scan - block fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: json
          output: artifacts/security/trivy-fs.json
          version: v0.70.0
          timeout: 10m0s
      - name: Upload filesystem findings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filesystem-trivy
          path: artifacts/security/trivy-fs.json
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: codeql-${{ matrix.language }}
    needs: changes
    if: ${{ needs.changes.outputs.codeql == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            mode: manual
          - language: javascript-typescript
            mode: none
          - language: go
            mode: manual
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: ${{ matrix.language == 'java-kotlin' }}
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        if: ${{ matrix.language == 'go' }}
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Initialize CodeQL with security-extended queries
        uses: github/codeql-action/init@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          queries: security-extended
      - name: Build Java for CodeQL
        if: ${{ matrix.language == 'java-kotlin' }}
        run: mvn -B -ntp -DskipTests package
      - name: Build Go CLI for CodeQL
        if: ${{ matrix.language == 'go' }}
        working-directory: cli
        run: go build ./...
      - name: Analyze selected language
        uses: github/codeql-action/analyze@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0
        with:
          category: /language:${{ matrix.language }}

  gate:
    name: gate
    needs: [changes, static, api-contract, java-tests, java-quality, db-migrations, upgrade-path, cli-test, cli-build, cli-integration, docker-smoke, browser, secrets, workflow-lint, dependency-vulns, filesystem-vulns, codeql]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Evaluate every selected job (failure, cancellation and unexpected skips block)
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-evaluate-gate.py
