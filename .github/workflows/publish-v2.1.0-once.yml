name: Publish v2.1.0 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.1.0-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 2b3fbbe5698148e463cf509da5390a93f99ed45d
      RELEASE_TAG: v2.1.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify exact finalized commit and green CI gate
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          test "$(git rev-parse "$TARGET_SHA^{tree}")" = "$(git rev-parse HEAD^1^{tree})" || {
            echo "Target finalized tree no longer matches the pre-publisher main tree" >&2
            exit 1
          }

          run_json="$(gh api             -H 'Accept: application/vnd.github+json'             "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=20")"
          conclusion="$(jq -r '[.workflow_runs[] | select(.name=="CI")] | sort_by(.created_at) | last | .conclusion // ""' <<<"$run_json")"
          test "$conclusion" = "success" || {
            echo "Finalized target CI is not green: $conclusion" >&2
            exit 1
          }

          jobs_url="$(jq -r '[.workflow_runs[] | select(.name=="CI")] | sort_by(.created_at) | last | .jobs_url' <<<"$run_json")"
          gate="$(gh api "$jobs_url" --paginate | jq -r '[.jobs[] | select(.name=="gate")] | last | .conclusion // ""')"
          test "$gate" = "success" || {
            echo "Finalized target gate is not green: $gate" >&2
            exit 1
          }

      - name: Verify v2.1.0 is not already published
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to move or reuse it." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Create stable v2.1.0 tag and GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --target "$TARGET_SHA"             --title "ClamAV Web UI v2.1.0"             --notes-file docs/releases/v2.1.0.md             --verify-tag=false

      - name: Verify publication
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,targetCommitish,url
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$TARGET_SHA"
