name: Publish v2.1beta1 prerelease (tag-gated)

on:
  push:
    tags:
      - v2.1beta1

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify beta source and secrets
        run: |
          python3 scripts/check-safe-scanning-source.py
          python3 tools/audit-source-package.py .
      - name: Maven verification
        run: mvn -B verify
      - name: Package complete tracked source
        run: git archive --format=zip --output=clamav-webui-v2.1beta1-full-source.zip HEAD
      - name: Publish GitHub prerelease (never merges main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.1beta1 \
            --prerelease \
            --verify-tag \
            --title 'ClamAV Web UI v2.1beta1 (beta)' \
            --notes-file docs/releases/v2.1beta1.md \
            clamav-webui-v2.1beta1-full-source.zip
