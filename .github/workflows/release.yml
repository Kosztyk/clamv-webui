name: Verified release

# Tag releases are never allowed to bypass the green main CI gate.
# Manual runs exercise the entire pipeline, but may NEVER create/publish releases.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SemVer tag to dry-run (example: v2.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check canonical POM, OpenAPI, CLI, Compose, README and exact tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python3 scripts/check-versions.py --tag "$RELEASE_TAG"
      - name: Require matching POM version, main ancestry and green main-push gate
        id: verify
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release-verify-tag.py --tag "$RELEASE_TAG"

  release-tests:
    name: release-tests
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      CLAMAV_REQUIRE_BROWSER: '1'
      COMPOSE_PROJECT_NAME: clamav-release-${{ github.run_id }}
      COMPOSE_FILE: docker-compose.yml:examples/compose/shared-paths.override.yaml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci-browser-requirements.txt
      - name: Install browser dependencies (no silently skipped release browser tests)
        run: |
          python -m pip install -r scripts/ci-browser-requirements.txt PyYAML==6.0.2 cryptography==46.0.4
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print('CHROMIUM_PATH=' + playwright.chromium.executable_path)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Lint the exact tagged OpenAPI and verify controller/CLI routes
        run: |
          python3 scripts/issue55-api-contract.py
          python3 scripts/test-issue55-api-contract.py
          npx --yes --package=@stoplight/spectral-cli@6.17.1 spectral lint --ruleset .spectral.yaml --fail-severity error src/main/resources/openapi/clamav-v1.yaml
      - name: Block released API v1 breaking changes with pinned oasdiff
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go install github.com/oasdiff/oasdiff@v1.11.8
          python3 scripts/issue58-resolve-predecessor.py --stable-only --output artifacts/api-contract/predecessor.json
          previous="$(python3 -c 'import json; print(json.load(open("artifacts/api-contract/predecessor.json"))["commit_sha"])')"
          python3 scripts/issue55-api-breaking.py --previous-tag "$previous" --oasdiff "$(go env GOPATH)/bin/oasdiff"
      - name: Audit tracked release source for secrets and runtime state
        run: python3 tools/audit-source-package.py .
      - name: Run complete release gate, including Maven clean verify and Docker build
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/release-gate.sh --docker-build
      - name: Re-run Java quality, dependency convergence and Spotless before release
        run: |
          mvn -B -ntp -Pci-quality -DskipTests -Djacoco.skip=true -Dspotless.ratchet.ref=HEAD^ verify spotless:check
          python3 scripts/issue53-compare-quality.py --reviewed-baseline config/java-quality-baseline.json
      - name: Verify metadata embedded into built application assets
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: python3 scripts/check-versions.py --tag "$RELEASE_TAG" --verify-built
      - name: Verify release image HEALTHCHECK and non-root runtime
        run: |
          COMPOSE_IMAGE="$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["clamav-web-client"]["image"])')"
          docker image tag "$COMPOSE_IMAGE" clamav-web-client:release-candidate
          bash scripts/issue37-smoke.sh clamav-web-client:release-candidate
      - name: Block release on known CRITICAL OS/library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clamav-web-client:release-candidate
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: table
          version: v0.70.0
          timeout: 10m0s
      - name: Block fixable HIGH/CRITICAL vulnerabilities before release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clamav-web-client:release-candidate
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: table
          version: v0.70.0
      - name: Block fixable HIGH/CRITICAL source dependencies before release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
          format: table
          version: v0.70.0
      - name: Run scanner Compose and end-to-end EICAR tests
        run: |
          python3 scripts/test-clamd-compose-isolation.py
          mkdir -p conf data/uploads scandir
          sudo chown -R 10001:10001 conf data
          sudo chmod 0700 conf data/uploads
          docker compose build clamav-server
          docker compose up -d --no-build
          bash scripts/smoke-non-root.sh
          bash scripts/smoke-eicar.sh
          CLAMAV_SMOKE_CLEAN=true bash scripts/smoke-eicar.sh
          python3 scripts/test-clamd-compose-isolation.py --runtime-native
      - name: Assert JAR available for release
        env:
          RELEASE_VERSION: ${{ needs.verify-tag.outputs.version }}
        run: test -s "target/clamav-web-client-${RELEASE_VERSION}.jar"
      - name: Upload verified application JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-jar
          path: target/clamav-web-client-*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Collect container logs on any result
        if: ${{ always() }}
        run: |
          mkdir -p artifacts/release-container-logs
          docker compose ps -a > artifacts/release-container-logs/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/release-container-logs/compose.log 2>&1 || true
      - name: Upload Surefire/Failsafe and browser traces
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-java-and-browser-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
            target/spotbugs.xml
            target/spotbugsXml.xml
            target/pmd.xml
            artifacts/playwright/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload release container logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-container-logs
          path: artifacts/release-container-logs/**
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable release smoke containers
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans || true

  db-migrations:
    name: release-db-${{ matrix.vendor }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        vendor: [postgresql, mysql, mariadb]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require Testcontainers database migration integration tests
        env:
          DB_VENDOR: ${{ matrix.vendor }}
        run: >-
          mvn -B -ntp -Pdb-integration
          -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=Phase2DatabaseIT
          -Dclamav.db.vendor="$DB_VENDOR" -Djacoco.skip=true verify
      - name: Capture database container status on failure
        if: ${{ failure() }}
        run: |
          mkdir -p artifacts/db
          docker ps -a --no-trunc > artifacts/db/containers.txt || true
      - name: Upload database test reports and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-db-${{ matrix.vendor }}-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            artifacts/db/**
          if-no-files-found: warn
          retention-days: 14

  upgrade-path:
    name: release-upgrade-${{ matrix.vendor }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        vendor: [h2, postgresql]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install YAML and encryption dependencies for upgrade fixtures
        run: python3 -m pip install PyYAML==6.0.2 cryptography==46.0.4
      - name: Check previous GitHub release identity, baseline fixtures and required Docker test
        run: |
          python3 scripts/check-issue57-upgrade-path.py
          python3 scripts/test-issue57-upgrade-path.py
      - name: Prepare Maven JDBC drivers for legacy data round-trip
        run: |
          mvn -B -ntp -q dependency:copy-dependencies \
            -DincludeGroupIds=com.h2database,org.postgresql \
            -DoutputDirectory=artifacts/upgrade-drivers
      - name: Resolve the latest published predecessor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/issue58-resolve-predecessor.py
      - name: Upgrade the actual previous-release H2/PostgreSQL image and persistent config
        env:
          UPGRADE_VENDOR: ${{ matrix.vendor }}
        run: python3 scripts/issue57-upgrade-path.py --vendor "$UPGRADE_VENDOR"
      - name: Upload redacted database upgrade evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-upgrade-${{ matrix.vendor }}
          path: artifacts/upgrade-path/**
          if-no-files-found: warn
          retention-days: 14

  cli-test:
    name: release-cli-test
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Unit, race and vet tests
        working-directory: cli
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Install and enforce pinned staticcheck and govulncheck
        working-directory: cli
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/staticcheck" ./...
          "$(go env GOPATH)/bin/govulncheck" ./...

  clamctl:
    name: release-clamctl-build
    needs: [verify-tag, cli-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Reproducibly cross-compile six binaries and check embedded tag version
        env:
          RELEASE_VERSION: ${{ needs.verify-tag.outputs.version }}
        run: python3 scripts/issue54-cli-repro.py --version "$RELEASE_VERSION" --out cli/dist
      - name: Upload exact reproducible binaries and SHA256SUMS
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-clamctl
          path: cli/dist/**
          if-no-files-found: error
          retention-days: 14

  cli-integration:
    name: release-cli-integration
    needs: [verify-tag, release-tests, clamctl]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-clamctl
          path: cli/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-jar
          path: target
      - name: Verify downloaded CLI and run real Spring integration test
        run: |
          chmod +x cli/dist/linux_amd64/clamctl
          python3 scripts/issue54-cli-repro.py --verify-only --out cli/dist
          python3 scripts/test-clamctl-integration.py
      - name: Upload CLI integration application logs on failure
        if: ${{ failure() }}
        run: echo 'CLI isolated test logs are printed by the test runner on failure.'

  cli-sign:
    name: release-cli-sign-checksums
    needs: [verify-tag, clamctl, cli-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-clamctl
          path: artifacts/cli
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3
      - name: Derive independent checksums of all six tested release binaries
        run: python3 scripts/issue54-cli-signing.py --input artifacts/cli --out artifacts/cli-sign
      - name: Sign exact checksum bytes using GitHub OIDC without private keys
        run: cosign sign-blob --yes --new-bundle-format --bundle artifacts/cli-sign/clamctl-SHA256SUMS.sigstore.json artifacts/cli-sign/clamctl-SHA256SUMS
      - name: Independently verify release workflow identity and signed checksum bytes
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/issue54-verify-cli-signature.sh artifacts/cli-sign/clamctl-SHA256SUMS artifacts/cli-sign/clamctl-SHA256SUMS.sigstore.json "$RELEASE_TAG"
      - name: Upload signed detached CLI checksum manifest and Sigstore bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cli-signed-checksums
          path: artifacts/cli-sign/**
          if-no-files-found: error
          retention-days: 14

  image-publish:
    name: publish-and-verify-image
    # Manual workflow_dispatch may run all validation jobs, but must never write to GHCR.
    if: ${{ github.event_name == 'push' }}
    needs: [verify-tag, release-tests, db-migrations, upgrade-path, cli-test, clamctl, cli-integration, cli-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CLAMAV_BOOTSTRAP_ADMIN_PASSWORD: CIOnlyGeneratedFixturePass456
      COMPOSE_PROJECT_NAME: clamav-image-release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm approved tag before registry writes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: python3 scripts/release-verify-tag.py --remote-ref-only --tag "$RELEASE_TAG" --expected-sha "$RELEASE_COMMIT"
      - name: Derive immutable GHCR destination and SemVer from verified tag
        id: meta
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: python3 scripts/issue51-image-release.py metadata --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push a staging OCI index with SBOM and SLSA provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.stage }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-tag.outputs.commit }}
            org.opencontainers.image.version=${{ needs.verify-tag.outputs.version }}
      - name: Assert pushed OCI index has both architectures and BuildKit attestations
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p artifacts/image
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > artifacts/image/oci-index.json
          python3 scripts/issue51-image-release.py manifest --input artifacts/image/oci-index.json
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Fail closed on unfixed HIGH/CRITICAL OS or library CVEs in BOTH pushed architectures
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "Scanning pushed $IMAGE@$DIGEST for $platform"
            trivy image --platform "$platform" --scanners vuln --pkg-types os,library \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --timeout 15m \
              "$IMAGE@$DIGEST"
          done
      - name: Generate CycloneDX SBOM from each pushed architecture
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            trivy image --platform "linux/$arch" --scanners vuln --format cyclonedx \
              --output "artifacts/image/sbom-$arch.cdx.json" "$IMAGE@$DIGEST"
            python3 scripts/issue51-image-release.py sbom --input "artifacts/image/sbom-$arch.cdx.json"
          done
      - name: Generate and validate release-scoped OpenVEX for Alpine musl backport
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          python3 scripts/vex_release.py generate \
            --image "$IMAGE" --digest "$DIGEST" --version "$VERSION" \
            --output artifacts/image/CVE-2026-107891.vex.json
          python3 scripts/vex_release.py validate \
            --file artifacts/image/CVE-2026-107891.vex.json \
            --image "$IMAGE" --digest "$DIGEST" --version "$VERSION"
      - name: Attach OpenVEX via OCI referrers on the staging tag
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: attestation-add
          organization: kosztyk
          image: ${{ steps.meta.outputs.stage }}
          file: artifacts/image/CVE-2026-107891.vex.json
          predicate-type: https://openvex.dev/ns/v0.2.0
          referrer: true
          registry-user: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-write-user: ${{ github.actor }}
          registry-write-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Docker Scout applies the publisher-authored VEX
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          organization: kosztyk
          image: registry://${{ steps.meta.outputs.stage }}
          vex-author: https://github.com/Kosztyk/clamv-webui
          only-vex-affected: true
          only-severities: critical,high
          exit-code: true
          registry-user: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3
      - name: Keyless-sign OCI digest and attest both CycloneDX SBOMs
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          for arch in amd64 arm64; do
            cosign attest --yes --type cyclonedx --predicate "artifacts/image/sbom-$arch.cdx.json" "$IMAGE@$DIGEST"
          done
      - name: Independently verify signature, identity, issuer and CycloneDX attestations
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/issue51-verify-signature.sh "$IMAGE@$DIGEST" "$RELEASE_TAG"
      - name: Pull the exact published digest (not the locally built candidate)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          export CLAMAV_WEBUI_IMAGE_REF="$IMAGE@$DIGEST"
          docker pull --platform linux/amd64 "$CLAMAV_WEBUI_IMAGE_REF"
          # The scanner companion is separately pinned and must be present;
          # --pull never in the next step prevents silently substituting images.
          scanner="$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["clamav-server"]["image"])')"
          docker pull --platform linux/amd64 "$scanner"
          docker compose config --quiet
          test "$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["clamav-web-client"]["image"])')" = "$CLAMAV_WEBUI_IMAGE_REF"
      - name: Launch pulled digest and verify container image reference
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          export CLAMAV_WEBUI_IMAGE_REF="$IMAGE@$DIGEST"
          mkdir -p conf data/uploads
          sudo chown -R 10001:10001 conf data
          sudo chmod 0700 conf data/uploads
          docker compose up -d --no-build --pull never
          container="$(docker compose ps -q clamav-web-client)"
          test -n "$container"
          test "$(docker inspect --format '{{.Config.Image}}' "$container")" = "$CLAMAV_WEBUI_IMAGE_REF"
          bash scripts/smoke-non-root.sh
          bash scripts/smoke-eicar.sh
          CLAMAV_SMOKE_CLEAN=true bash scripts/smoke-eicar.sh
          python3 scripts/test-clamd-compose-isolation.py --runtime
      - name: Promote the SAME verified OCI index digest to release tags
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/release-verify-tag.py --remote-ref-only --tag "$RELEASE_TAG" --expected-sha "$RELEASE_COMMIT"
          python3 scripts/issue51-image-release.py tags --tag "$RELEASE_TAG" --image "$IMAGE" \
            --digest "$DIGEST" --github-output artifacts/image/tags.txt
          mapfile -t tags < artifacts/image/tags.txt
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for tag in "${tags[@]}"; do
            actual="$(docker buildx imagetools inspect "$IMAGE:$tag" | awk '/^Digest:/ {print $2; exit}')"
            test "$actual" = "$DIGEST" || { echo "Tag $tag has digest $actual instead of $DIGEST" >&2; exit 1; }
          done
          bash scripts/issue51-verify-signature.sh "$IMAGE@$DIGEST" "$RELEASE_TAG"
      - name: Record verified registry digest and release tags
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: python3 scripts/issue51-image-release.py record --image "$IMAGE" --digest "$DIGEST" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --output artifacts/image/image-reference.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signed-image
          path: |
            artifacts/image/image-reference.json
            artifacts/image/sbom-amd64.cdx.json
            artifacts/image/sbom-arm64.cdx.json
            artifacts/image/oci-index.json
            artifacts/image/CVE-2026-107891.vex.json
          if-no-files-found: error
          retention-days: 30
      - name: Capture digest smoke logs on success or failure
        if: ${{ always() }}
        run: |
          mkdir -p artifacts/container-logs
          docker compose ps -a > artifacts/container-logs/compose-ps.txt 2>&1 || true
          docker compose logs --timestamps --no-color > artifacts/container-logs/compose.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: release-pushed-image-logs
          path: artifacts/container-logs/**
          if-no-files-found: warn
          retention-days: 14
      - name: Remove digest smoke containers and volumes
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans || true

  draft:
    name: draft-release
    # workflow_dispatch is a dry-run; no write credentials or draft publication.
    if: ${{ github.event_name == 'push' }}
    needs: [verify-tag, release-tests, db-migrations, upgrade-path, cli-test, clamctl, cli-integration, cli-sign, image-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-jar
          path: artifacts/jar
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-clamctl
          path: artifacts/cli
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signed-image
          path: artifacts/image
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-cli-signed-checksums
          path: artifacts/cli-sign
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Independently reverify signed image before release drafting
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          ref="$(python3 -c 'import json; print(json.load(open("artifacts/image/image-reference.json"))["immutableReference"])')"
          bash scripts/issue51-verify-signature.sh "$ref" "$RELEASE_TAG"
      - name: Verify CLI checksum signature against exact release tag identity before drafting
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/issue54-verify-cli-signature.sh artifacts/cli-sign/clamctl-SHA256SUMS artifacts/cli-sign/clamctl-SHA256SUMS.sigstore.json "$RELEASE_TAG"
      - name: Verify tag still points at the approved commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: python3 scripts/release-verify-tag.py --remote-ref-only --tag "$RELEASE_TAG" --expected-sha "$RELEASE_COMMIT"
      - name: Flatten assets and verify release-wide SHA256SUMS
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          python3 scripts/release-assets.py --tag "$RELEASE_TAG" \
            --jar-dir artifacts/jar --cli-dir artifacts/cli --image-dir artifacts/image \
            --cli-sign-dir artifacts/cli-sign --require-cli-signature \
            --source . --out artifacts/release
          python3 tools/audit-source-package.py "artifacts/release/clamav-webui-${RELEASE_TAG}-full-source.zip"
          cd artifacts/release
          sha256sum -c SHA256SUMS
      - name: Upload exact checksummed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verified-assets
          path: artifacts/release/**
          if-no-files-found: error
          retention-days: 30
      - name: Create DRAFT GitHub release with generated notes (never auto-publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing GitHub release' >&2
            exit 1
          fi
          args=(--draft --verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" artifacts/release/*

  publish:
    name: publish-after-approval
    # Default-off safety latch: configure protected `release` environment with
    # required reviewers, then set repository variable RELEASE_PUBLICATION_ENABLED=true.
    if: ${{ github.event_name == 'push' && vars.RELEASE_PUBLICATION_ENABLED == 'true' }}
    needs: [verify-tag, draft]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - name: Verify approved tag has not moved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: python3 scripts/release-verify-tag.py --remote-ref-only --tag "$RELEASE_TAG" --expected-sha "$RELEASE_COMMIT"
      - name: Download published draft assets and verify their checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft)" = true
          mkdir -p artifacts/approval
          gh release download "$RELEASE_TAG" --dir artifacts/approval
          python3 scripts/release-assets.py --out artifacts/approval --verify-only --require-image-evidence --require-cli-signature
          (cd artifacts/approval && sha256sum -c SHA256SUMS)
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reverify keyless signed CLI checksums before approval
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/issue54-verify-cli-signature.sh artifacts/approval/clamctl-SHA256SUMS artifacts/approval/clamctl-SHA256SUMS.sigstore.json "$RELEASE_TAG"
      - name: Reverify signed image before approved publication
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          ref="$(python3 -c 'import json; print(json.load(open("artifacts/approval/image-reference.json"))["immutableReference"])')"
          bash scripts/issue51-verify-signature.sh "$ref" "$RELEASE_TAG"
      - name: Publish previously verified draft after environment approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
