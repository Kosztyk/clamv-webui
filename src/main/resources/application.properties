spring.application.name=clamav-web-client

spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

server.tomcat.max-swallow-size=2048MB
# --- Persistence (H2 by default; override via SPRING_DATASOURCE_URL for Postgres etc.) ---
spring.datasource.url=jdbc:h2:file:./data/clamav-web-client;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# Flyway applies the versioned schema before Hibernate checks it. Never use update in production.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
# Avoid silently converting historical PostgreSQL Large Object columns.
app.db.postgres-lob-auto-migrate=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.h2.console.enabled=false
spring.h2.console.path=/h2

# --- Errors (UI-friendly) ---
# Do not leak stack traces or internal file paths through public error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# The metrics endpoint requires a configured secret even when it shares the UI listener.
# Recommended: set MANAGEMENT_SERVER_PORT=9091 and bind that port only on trusted networks.
# Never publish an unprotected management listener.
clamav.metrics.scrape-token=${CLAMAV_METRICS_SCRAPE_TOKEN:}
clamav.metrics.clamd-poll-ms=30000
clamav.metrics.clamd-max-endpoints=12
# Optional mounted configuration; never writes files or reloads ClamD.
clamav.config.clamd-path=${CLAMAV_CONFIG_PATH:}
clamav.config.freshclam-path=${FRESHCLAM_CONFIG_PATH:}
clamav.config.poll-ms=${CLAMAV_CONFIG_POLL_MS:30000}
# An explicit clamd path opts in to default-endpoint and scan-policy synchronization.
# Set false for inspection only. No path means disabled regardless of this flag.
clamav.config.discovery-enabled=${CLAMAV_CONFIG_DISCOVERY_ENABLED:true}
management.endpoint.health.show-details=when_authorized

# --- App security ---
# First-run admin is generated securely and written once to data/bootstrap-admin-password.
# To supply a password explicitly, set CLAMAV_BOOTSTRAP_ADMIN_PASSWORD (minimum 12 characters).
# Rotate the bootstrap password via Admin > Users, then delete the bootstrap file.
server.forward-headers-strategy=none
# Enable native proxy forwarded headers ONLY behind a trusted reverse proxy.

# Phase 1 versioned API (rate limiter is per instance; use edge limits if scaled out)
api.v1.scan-rate-limit-per-minute=30
api.v1.max-page-size=100
api.v1.clamd.max-database-age-hours=168
# Must match timezone used for clamd VERSION database timestamp interpretation.
api.v1.clamd.database-timezone=UTC

# --- Phase 3: Identity providers are independent opt-in features. ---
# Compatibility with the LDAP configuration contract. Explicit clamav.identity.ldap.*
# properties / CLAMAV_IDENTITY_LDAP_* values still override these packaged defaults.
# security.ldap.* also resolves SECURITY_LDAP_* environment variables through Spring.
clamav.identity.ldap.enabled=${CLAMAV_IDENTITY_LDAP_ENABLED:${security.ldap.enabled:false}}
clamav.identity.ldap.url=${CLAMAV_IDENTITY_LDAP_URL:${security.ldap.url:}}
clamav.identity.ldap.base-dn=${CLAMAV_IDENTITY_LDAP_BASE_DN:${security.ldap.base-dn:}}
clamav.identity.ldap.user-search-base=${CLAMAV_IDENTITY_LDAP_USER_SEARCH_BASE:${security.ldap.user-search-base:}}
clamav.identity.ldap.user-search-filter=${CLAMAV_IDENTITY_LDAP_USER_SEARCH_FILTER:${security.ldap.user-search-filter:(uid={0})}}
clamav.identity.ldap.group-search-base=${CLAMAV_IDENTITY_LDAP_GROUP_SEARCH_BASE:${security.ldap.group-search-base:}}
clamav.identity.ldap.group-search-filter=${CLAMAV_IDENTITY_LDAP_GROUP_SEARCH_FILTER:${security.ldap.group-search-filter:}}
clamav.identity.ldap.manager-dn=${CLAMAV_IDENTITY_LDAP_MANAGER_DN:${security.ldap.bind-dn:}}
clamav.identity.ldap.manager-password=${CLAMAV_IDENTITY_LDAP_MANAGER_PASSWORD:${security.ldap.bind-password:}}
# OIDC defaults to disabled in IdentityProperties. A complete standard Spring
# 'oidc' registration activates it unless explicitly disabled or overridden in UI.
# OidcConfigurationCompatibility bridges standard properties to the lazy provider.
# Never put LDAP bind passwords or OIDC client secrets in this file.
# Configure trusted LDAPS/StartTLS / JVM CA certificates before enabling LDAP.
# OIDC uses Boot client registration 'clamav', issuer discovery and confidential authorization code.

# Phase 3.1: UI-managed authentication. Docker variables bootstrap settings until saved in UI.
clamav.app.version=2.0.0
# Keep REST, persisted settings, notifications and WebSocket JSON on Jackson 2 during the Boot 4 migration.
spring.http.converters.preferred-json-mapper=jackson2
spring.websocket.messaging.preferred-json-mapper=jackson2
# Secret encryption key persists in ./conf/auth-settings.key; keep this volume securely backed up.
# CLAMAV_AUTH_SETTINGS_KEY_FILE overrides the default location; CLAMAV_AUTH_SETTINGS_KEY is base64-encoded 32-byte key.

# Expose v2.0.0 as actuator/info build metadata (build-info is generated by Maven).
management.info.build.enabled=true
