spring.application.name=clamav-web-client

spring.servlet.multipart.max-file-size=2047MB
spring.servlet.multipart.max-request-size=2048MB
# Startup-bound; Configuration Center may override this property when not locked by
# a deployment SPRING_SERVLET_MULTIPART_LOCATION value. The Docker image supplies
# CLAMAV_CONTAINER_MULTIPART_DEFAULT=/app/data/tmp/multipart as a *fallback*, not
# an overriding environment alias, so GUI changes remain editable.
# Standalone Java uses the OS temp directory when no value is supplied.
spring.servlet.multipart.location=${SPRING_SERVLET_MULTIPART_LOCATION:${CLAMAV_CONTAINER_MULTIPART_DEFAULT:}}

server.tomcat.max-swallow-size=2048MB
# Bounded HTTP envelope. A 10 KiB User-Agent can reach the audit field truncation.
server.max-http-request-header-size=16KB
# --- Persistence (embedded file H2 is a single-instance default; use PostgreSQL for production) ---
# DB_CLOSE_DELAY=0 explicitly resets a possibly persisted legacy -1 delay.
# Leave DB_CLOSE_ON_EXIT at H2's safe default (TRUE). Docker/Compose should send SIGTERM
# and allow the JVM to close the Hikari pool; never use docker kill for normal shutdown.
# Override via SPRING_DATASOURCE_URL for PostgreSQL / MySQL / MariaDB.

spring.datasource.url=jdbc:h2:file:./data/clamav-web-client;MODE=PostgreSQL;DB_CLOSE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
# Release repository connections before views and potentially slow upload copies.
spring.jpa.open-in-view=false
# A slow daemon poll must not serialize configuration, watcher, metrics and queue maintenance.
spring.task.scheduling.pool.size=4
# Network budgets include DNS/connect; a complete health snapshot shares the command deadline.
clamav.client.connect-timeout=${CLAMAV_CLIENT_CONNECT_TIMEOUT:3s}
clamav.client.command-timeout=${CLAMAV_CLIENT_COMMAND_TIMEOUT:5s}
clamav.client.scan-timeout=${CLAMAV_CLIENT_SCAN_TIMEOUT:24h}
# Flyway applies the versioned schema before Hibernate checks it. Never use update in production.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
# Avoid silently converting historical PostgreSQL Large Object columns.
app.db.postgres-lob-auto-migrate=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# H2 console classes are intentionally not packaged; file-backed H2 remains supported.

# --- Errors (UI-friendly) ---
# Do not leak stack traces or internal file paths through public error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# The metrics endpoint requires a configured secret even when it shares the UI listener.
# Recommended: set MANAGEMENT_SERVER_PORT=9091 and bind that port only on trusted networks.
# Never publish an unprotected management listener.
clamav.metrics.scrape-token=${CLAMAV_METRICS_SCRAPE_TOKEN:}
clamav.metrics.clamd-poll-ms=30000
# Cache ClamD STATS/VERSION across viewers; 1–3 seconds, default 2 seconds.
# Issue #38: native PTY connections use a strict 8-global/2-per-user budget.
# Hidden or abandoned browser tabs stop heartbeating and expire after 180 seconds.
clamav.clamdtop.idle-timeout-seconds=${CLAMAV_CLAMDTOP_IDLE_TIMEOUT_SECONDS:180}
clamav.metrics.clamdtop-cache-ttl-ms=${CLAMAV_CLAMDTOP_CACHE_TTL_MS:2000}
# Bound signature label cardinality for Prometheus; two fixed buckets (other/unknown) are additional.
clamav.metrics.signatures.max-distinct=${CLAMAV_METRICS_SIGNATURES_MAX_DISTINCT:100}
clamav.metrics.clamd-max-endpoints=12
# Optional mounted configuration; never writes files or reloads ClamD.
clamav.config.clamd-path=${CLAMAV_CONFIG_PATH:}
clamav.config.freshclam-path=${FRESHCLAM_CONFIG_PATH:}
clamav.config.poll-ms=${CLAMAV_CONFIG_POLL_MS:30000}
# An explicit clamd path opts in to default-endpoint and scan-policy synchronization.
# Set false for inspection only. No path means disabled regardless of this flag.
clamav.config.discovery-enabled=${CLAMAV_CONFIG_DISCOVERY_ENABLED:true}
# Issue #37: enable a minimal unauthenticated GET /actuator/health/liveness.
# Keep the existing actuator/prometheus route and its independent scrape-token filter.
# Optional: set MANAGEMENT_SERVER_PORT and MANAGEMENT_SERVER_ADDRESS=127.0.0.1
# for a dedicated local management listener. No extra port is published by Compose.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

# --- App security ---
# Idle timeout slides with requests; the independent maximum age always requires a fresh login.
# Issue #27: do not infer cookie security from the backend socket. HTTPS-only session
# cookies remain the secure default. An administrator who intentionally serves the UI
# directly over plain HTTP on a trusted network can persist cookie.secure=false from
# Setup & recovery / Configuration Center; HTTP provides no transport encryption.
server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE:lax}
clamav.security.session.max-age=${CLAMAV_SECURITY_SESSION_MAX_AGE:1h}
# First-run admin is generated securely and written once to data/bootstrap-admin-password.
# To supply a password explicitly, set CLAMAV_BOOTSTRAP_ADMIN_PASSWORD (minimum 12 characters).
# Rotate the bootstrap password via Admin > Users, then delete the bootstrap file.
# Direct requests use the socket peer and transport, never client-supplied headers (issue #13).
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
# Proxy TLS is opt-in: select native AND list only the actual proxy peers.
# Deny all peers until explicitly configured; do not inherit Tomcat's private-network trust.
server.tomcat.remoteip.internal-proxies=${SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES:(?!)}
server.tomcat.remoteip.trusted-proxies=${SERVER_TOMCAT_REMOTEIP_TRUSTED_PROXIES:(?!)}

# Phase 1 versioned API (rate limiter is per instance; use edge limits if scaled out)

# Webhook delivery is asynchronous and bounded in every normal Docker/JAR build (issue #12).
clamav.webhook.connect-timeout=${CLAMAV_WEBHOOK_CONNECT_TIMEOUT:5s}
clamav.webhook.read-timeout=${CLAMAV_WEBHOOK_READ_TIMEOUT:10s}
clamav.webhook.dns-timeout=${CLAMAV_WEBHOOK_DNS_TIMEOUT:5s}
clamav.webhook.delivery-timeout=${CLAMAV_WEBHOOK_DELIVERY_TIMEOUT:20s}
clamav.webhook.workers=${CLAMAV_WEBHOOK_WORKERS:2}
clamav.webhook.queue-capacity=${CLAMAV_WEBHOOK_QUEUE_CAPACITY:100}
clamav.webhook.allow-private-addresses=${CLAMAV_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:false}

api.v1.scan-rate-limit-per-minute=30
api.v1.scan-rate-limit-max-entries=${API_V1_SCAN_RATE_LIMIT_MAX_ENTRIES:10000}
clamav.security.login.max-entries=${CLAMAV_SECURITY_LOGIN_MAX_ENTRIES:10000}
api.v1.max-page-size=100
api.v1.clamd.max-database-age-hours=168
# Must match timezone used for clamd VERSION database timestamp interpretation.
api.v1.clamd.database-timezone=UTC

# --- Phase 3: Identity providers are independent opt-in features. ---
# Compatibility with the LDAP configuration contract. Explicit clamav.identity.ldap.*
# properties / CLAMAV_IDENTITY_LDAP_* values still override these packaged defaults.
# security.ldap.* also resolves SECURITY_LDAP_* environment variables through Spring.
clamav.identity.ldap.enabled=${CLAMAV_IDENTITY_LDAP_ENABLED:${security.ldap.enabled:false}}
clamav.identity.ldap.url=${CLAMAV_IDENTITY_LDAP_URL:${security.ldap.url:}}
# #44: Set only on new installations before LDAP is first configured. Existing
# principals use the historical URL/base-DN issuer pinned once in the database.
clamav.identity.ldap.directory-id=${CLAMAV_IDENTITY_LDAP_DIRECTORY_ID:}
clamav.identity.ldap.base-dn=${CLAMAV_IDENTITY_LDAP_BASE_DN:${security.ldap.base-dn:}}
clamav.identity.ldap.user-search-base=${CLAMAV_IDENTITY_LDAP_USER_SEARCH_BASE:${security.ldap.user-search-base:}}
clamav.identity.ldap.user-search-filter=${CLAMAV_IDENTITY_LDAP_USER_SEARCH_FILTER:${security.ldap.user-search-filter:(uid={0})}}
clamav.identity.ldap.group-search-base=${CLAMAV_IDENTITY_LDAP_GROUP_SEARCH_BASE:${security.ldap.group-search-base:}}
clamav.identity.ldap.group-search-filter=${CLAMAV_IDENTITY_LDAP_GROUP_SEARCH_FILTER:${security.ldap.group-search-filter:}}
clamav.identity.ldap.manager-dn=${CLAMAV_IDENTITY_LDAP_MANAGER_DN:${security.ldap.bind-dn:}}
clamav.identity.ldap.manager-password=${CLAMAV_IDENTITY_LDAP_MANAGER_PASSWORD:${security.ldap.bind-password:}}
# OIDC defaults to disabled in IdentityProperties. A complete standard Spring
# 'oidc' registration activates it unless explicitly disabled or overridden in UI.
# OidcConfigurationCompatibility bridges standard properties to the lazy provider.
# Never put LDAP bind passwords or OIDC client secrets in this file.
# Configure trusted LDAPS/StartTLS / JVM CA certificates before enabling LDAP.
# OIDC uses Boot client registration 'clamav', issuer discovery and confidential authorization code.

# Configuration Center loads before DataSource/Flyway; explicit deployment values remain authoritative.
# GUI values live in conf/configuration-center.properties, with matching configuration-center.key.
# Fresh installs and failed startup expose protected /setup/ independently of the database.
clamav.app.version=@@project.version@@
# Keep REST, persisted settings, notifications and WebSocket JSON on Jackson 2 during the Boot 4 migration.
spring.http.converters.preferred-json-mapper=jackson2
spring.websocket.messaging.preferred-json-mapper=jackson2
# Secret encryption key persists in ./conf/auth-settings.key; keep this volume securely backed up.
# CLAMAV_AUTH_SETTINGS_KEY_FILE overrides the default location; CLAMAV_AUTH_SETTINGS_KEY is base64-encoded 32-byte key.

# Expose the POM version through the generated actuator/info build metadata.
management.info.build.enabled=true

# Bounded in-memory scan dispatch; rejected IDs remain QUEUED in the database
# for the periodic reconciliation sweep (app.scan.reconcile-interval-ms).
app.scan.queue-capacity=${APP_SCAN_QUEUE_CAPACITY:256}
# Stop new dispatch on SIGTERM; wait for active scans to finish, then interrupt.
# A cancelled RUNNING scan is retried on startup, and queued jobs remain durable.
# Combined shutdown waits are capped at 40s, below this 45s Spring shutdown phase
# and the packaged Docker Compose 60s stop grace. Adjust deployment budgets together.
app.scan.shutdown-grace-seconds=${APP_SCAN_SHUTDOWN_GRACE_SECONDS:20}
app.scan.shutdown-force-seconds=${APP_SCAN_SHUTDOWN_FORCE_SECONDS:5}

# Allow the scan worker lifecycle to finish ahead of bean destruction.
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:45s}