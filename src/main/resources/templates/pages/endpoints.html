<!doctype html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: shell(~{::section})}"><section class="admin-page "><header class="admin-page-header"><div class="admin-page-icon"><i class="fas fa-network-wired" aria-hidden="true"></i></div><div><h1>ClamD endpoints</h1><p class="muted">Manage the daemon connections used for scans.</p></div></header><div class="table-responsive"><table class="table app-table"><thead><tr><th>Name</th><th>Host</th><th>Port</th><th>Platform</th><th>Enabled</th><th>Actions</th></tr></thead>
<tbody><tr th:each="ep : ${endpoints}"><td th:text="${ep.name}"></td><td th:text="${ep.host}"></td><td th:text="${ep.port}"></td><td th:text="${ep.platform}"></td><td th:text="${ep.enabled}"></td>
<td><details><summary>Edit</summary><form method="post" th:action="@{/admin/endpoints/{id}/update(id=${ep.id})}" class="inline-form">
<input class="form-control" name="name" th:value="${ep.name}" required/><input class="form-control" name="host" th:value="${ep.host}" required/><input class="form-control" name="port" type="number" th:value="${ep.port}" required/>
<select class="form-select" name="platform"><option value="UNIX" th:selected="${ep.platform.name() == 'UNIX'}">UNIX</option><option value="WINDOWS" th:selected="${ep.platform.name() == 'WINDOWS'}">WINDOWS</option></select>
<label><input type="checkbox" name="enabled" value="true" th:checked="${ep.enabled}"/> Enabled</label><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-sm btn-primary">Update</button></form>
<form method="post" th:action="@{/admin/endpoints/{id}/delete(id=${ep.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-sm btn-outline-danger">Delete</button></form></details></td></tr></tbody></table></div>
<h2>Add endpoint</h2><form method="post" th:action="@{/admin/endpoints/create}" class="inline-form">
<input class="form-control" name="name" placeholder="Name" required/><input class="form-control" name="host" placeholder="Host or socket" required/><input class="form-control" name="port" type="number" value="3310" required/>
<select class="form-select" name="platform"><option>UNIX</option><option>WINDOWS</option></select><label><input type="checkbox" name="enabled" value="true" checked/>Enabled</label>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-primary">Create</button></form></section></html>
