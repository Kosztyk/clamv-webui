<!doctype html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: shell(~{::section})}"><section class="admin-page "><header class="admin-page-header"><div class="admin-page-icon"><i class="fas fa-folder-open" aria-hidden="true"></i></div><div><h1>Watch directories</h1><p class="muted">Scan new files in approved server directories.</p></div></header><p class="muted">Watching enabled: <strong th:text="${watchEnabled}"></strong></p>
<table class="table app-table"><thead><tr><th>Path</th><th>Endpoint</th><th>Enabled</th><th>Actions</th></tr></thead><tbody><tr th:each="wd : ${watchDirs}">
<td th:text="${wd.path}"></td><td th:text="${wd.endpoint != null ? wd.endpoint.name : '-'}"></td><td th:text="${wd.enabled}"></td><td class="inline-form">
<form method="post" th:action="@{/admin/watch/{id}/toggle(id=${wd.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-sm btn-outline-light">Toggle</button></form>
<form method="post" th:action="@{/admin/watch/{id}/delete(id=${wd.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></tbody></table>
<h2>Watch new directory</h2><form method="post" th:action="@{/admin/watch/create}" class="inline-form"><input name="path" class="form-control" placeholder="/scandir/folder" required/>
<select name="endpointId" class="form-select"><option th:each="ep : ${endpoints}" th:value="${ep.id}" th:text="${ep.name}"></option></select>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-primary">Add directory</button></form></section></html>
