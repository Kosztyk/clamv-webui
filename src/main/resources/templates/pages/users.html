<!doctype html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: shell(~{::section})}"><section class="admin-page "><header class="admin-page-header"><div class="admin-page-icon"><i class="fas fa-users" aria-hidden="true"></i></div><div><h1>User management</h1><p class="muted">Manage local accounts, roles and passwords.</p></div></header><div class="table-responsive"><table class="table app-table"><thead><tr><th>User</th><th>Roles</th><th>Enabled</th><th>Last login</th><th>Actions</th></tr></thead>
<tbody><tr th:each="user : ${users}"><td th:text="${user.username}"></td><td th:text="${user.roles}"></td><td th:text="${user.enabled}"></td><td th:text="${user.lastLoginAt}"></td><td>
<form method="post" th:action="@{/admin/users/{id}/reset(id=${user.id})}" class="inline-form"><input class="form-control" type="password" minlength="12" name="newPassword" placeholder="New password (12+ characters)" required/>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-sm btn-primary">Reset</button></form>
<form method="post" th:action="@{/admin/users/{id}/delete(id=${user.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></tbody></table></div>
<h2>Add user</h2><form method="post" th:action="@{/admin/users/create}" class="inline-form"><input class="form-control" name="username" placeholder="Username" required/>
<input class="form-control" name="password" minlength="12" type="password" placeholder="Password (12+ characters)" required/>
<select class="form-select" name="role"><option>VIEWER</option><option>OPERATOR</option><option>ADMIN</option></select><label><input type="checkbox" name="enabled" checked/>Enabled</label>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-primary">Create user</button></form></section></html>
