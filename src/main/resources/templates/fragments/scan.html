<div th:fragment="scan" data-ui-build="2.3.4" data-page="scan">
    <div class="card mb-3">
        <div class="card-body">
            <h4 class="card-title">Upload scan</h4>
            <p class="text-muted small">
                Multiple files supported. Max upload size (bytes): <span th:text="${uploadMaxBytes}"></span>
            </p>
            <form method="post" th:action="@{/scan/upload}" action="/scan/upload" enctype="multipart/form-data" class="row g-2 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="col-md-6">
                    <label class="form-label">Files</label>
                    <input class="form-control" type="file" name="files" multiple required />
                </div>
                <div class="col-md-4">
                    <label class="form-label">Endpoint</label>
                    <select class="form-select" name="endpointId">
                        <option th:each="ep : ${endpoints}"
                                th:value="${ep.id}"
                                th:selected="${endpointId != null and ep.id == endpointId}"
                                th:text="${ep.name}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100">Queue scan</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h4 class="card-title">Path scan</h4>
            <p class="text-muted small">Paths must be under allowed roots:</p>
            <ul class="small">
                <li th:each="r : ${allowedRoots}" th:text="${r}"></li>
            </ul>

            <form method="post" th:action="@{/scan/path}" action="/scan/path" class="row g-2 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="col-md-6">
                    <label class="form-label">Absolute path</label>
                    <input class="form-control" name="path" placeholder="/scandir" required />
                </div>
                <div class="col-md-4">
                    <label class="form-label">Endpoint</label>
                    <select class="form-select" name="endpointId">
                        <option th:each="ep : ${endpoints}"
                                th:value="${ep.id}"
                                th:selected="${endpointId != null and ep.id == endpointId}"
                                th:text="${ep.name}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100">Queue scan</button>
                </div>
            </form>
        </div>
    </div>
    <div class="card mt-3">
        <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <h4 class="card-title mb-0">Scan jobs</h4>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/jobs}" href="/jobs">View all</a>
            </div>

            <div th:if="${jobs == null or #lists.isEmpty(jobs)}" class="text-muted small">
                No jobs yet.
            </div>

            <div class="table-responsive" th:if="${jobs != null and !#lists.isEmpty(jobs)}">
                <table class="table table-sm align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Verdict</th>
                        <th>Submitted</th>
                        <th>Target</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="j : ${jobs}">
                        <td><a th:href="@{/jobs/{id}(id=${j.id})}" th:text="${j.id}">1</a></td>
                        <td th:text="${j.type}">UPLOAD</td>
                        <td th:text="${j.status}">DONE</td>
                        <td th:text="${j.verdict}">CLEAN</td>
                        <td th:text="${#temporals.format(j.submittedAt,'yyyy-MM-dd HH:mm:ss')}">-</td>
                        <td class="text-truncate" style="max-width: 520px;" th:text="${j.target}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${jobs != null and !#lists.isEmpty(jobs)}" class="small text-muted">
                Tip: click a job ID to view details, logs and detected signatures.
            </div>
        </div>
    </div>

</div>
