# Remote ClamD + existing external PostgreSQL.
# Replace EXAMPLE environment values in private .env; NEVER commit .env.
# This file does NOT create the database or the ClamD daemon.
# Bind 8082 to the reverse-proxy-reachable IP (or loopback when proxy is local).
services:
  clamav-web-client:
    image: kosztyk/clamav-web-client:v2
    container_name: clamav-gui
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${CLAMAV_WEB_BIND:-127.0.0.1}:8082:8080"
    environment:
      TZ: UTC
      CLAMAV_HOST: "${CLAMAV_HOST:?Set CLAMAV_HOST in .env}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
      CLAMAV_UPLOAD_PATH_SCAN_ENABLED: "false"    # remote ClamD without identical filesystem
      CLAMAV_UPLOAD_PATH_SCAN_FALLBACK_TO_INSTREAM: "false"
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:?Set JDBC URL in .env}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:?Set DB user in .env}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?Set DB password in .env}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      # Optional compatible *external* REST scanner; leave empty when not installed.
      CLAMAV_REST_URL: "${CLAMAV_REST_URL:-}"
      CLAMAV_REST_API_KEY: "${CLAMAV_REST_API_KEY:-}"
      CLAMAV_REST_FORM_KEY: FILES
      CLAMAV_REST_TIMEOUT_SECONDS: "10"
      CLAMAV_REST_UPLOAD_TIMEOUT_SECONDS: "3600"
      CLAMAV_REST_REPORT_MAX_JOBS: "5000"
      # Packaged default; restrict backend access to the proxy and replace headers there.
      SERVER_FORWARD_HEADERS_STRATEGY: "${SERVER_FORWARD_HEADERS_STRATEGY:-framework}"
      # Optional webhook tuning; finite timeouts and public destinations are the built-in defaults.
      CLAMAV_WEBHOOK_CONNECT_TIMEOUT: "${CLAMAV_WEBHOOK_CONNECT_TIMEOUT:-5s}"
      CLAMAV_WEBHOOK_READ_TIMEOUT: "${CLAMAV_WEBHOOK_READ_TIMEOUT:-10s}"
      CLAMAV_WEBHOOK_DNS_TIMEOUT: "${CLAMAV_WEBHOOK_DNS_TIMEOUT:-5s}"
      CLAMAV_WEBHOOK_DELIVERY_TIMEOUT: "${CLAMAV_WEBHOOK_DELIVERY_TIMEOUT:-20s}"
      CLAMAV_WEBHOOK_WORKERS: "${CLAMAV_WEBHOOK_WORKERS:-2}"
      CLAMAV_WEBHOOK_QUEUE_CAPACITY: "${CLAMAV_WEBHOOK_QUEUE_CAPACITY:-100}"
      CLAMAV_WEBHOOK_ALLOW_PRIVATE_ADDRESSES: "${CLAMAV_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:-false}"
    volumes:
      # Prepare bind mounts for UID/GID 10001; see docs/NON_ROOT_CONTAINER.md.
      - ./conf:/app/conf
      - ./data:/app/data
    restart: unless-stopped
